# Common merchants and their usual category, so a new user's first import isn't all uncategorized.
# Keys are default category names (Category::DEFAULTS); a user who renamed or deleted one just gets no
# suggestion for it. Values are merchant keys as Merchant.key_for normalizes them (upper case, no store
# number); a key matches when it is the prefix followed by the end or a space, so "STARBUCKS" matches
# "STARBUCKS COFFEE 1234" but not "STARBUCKSY". A merchant the user has categorized always wins.
